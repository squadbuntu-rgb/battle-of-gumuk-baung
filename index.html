<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#171a16">
<title>BATTLE OF GUMUK BAUNG — Tank Combat</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#171a16;color:#ddd;font-family:Consolas,"Courier New",monospace}
  canvas{display:block;width:100%;height:100%;cursor:pointer;touch-action:none}
  #hint{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);color:#c6c2b5b8;font-size:10px;letter-spacing:1.5px;pointer-events:none;text-align:center;white-space:nowrap}
  body.intro-active #game,body.intro-active #hint,body.intro-active #pause-toggle,body.lobby-active #game,body.lobby-active #hint,body.lobby-active #pause-toggle{display:none}
  #intro-video{position:fixed;inset:0;z-index:10;width:100vw;height:100vh;object-fit:cover;opacity:1;transition:opacity .9s ease}
  #intro-video.is-fading{opacity:0}
  #intro-video[hidden]{display:none}
  #lobby{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;overflow:auto;padding:26px 18px;
    background:linear-gradient(rgba(5,9,7,.38),rgba(5,8,7,.57)),url("./lobby.jpg") center / cover no-repeat;
    color:#ecebe2;opacity:0;transform:translateY(8px);transition:opacity .8s ease,transform .8s ease}
  #lobby[hidden]{display:none}
  #lobby.is-visible{opacity:1;transform:translateY(0)}
  #lobby.is-departing{opacity:0;transform:translateY(-8px);pointer-events:none}
  body.credits-active #game,body.credits-active #hint,body.credits-active #pause-toggle,body.credits-active #result,body.credits-active #pause-menu{display:none}
  #credits-screen{position:fixed;inset:0;z-index:20;display:grid;place-items:center;overflow:hidden;background:#000}
  #credits-screen[hidden]{display:none}
  #credits-image{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 1.2s ease}
  #credits-image.is-visible{opacity:1}
  #credits-return{position:absolute;z-index:1;top:50%;left:50%;transform:translate(-50%,-50%);min-width:min(280px,80vw);height:54px;padding:0 24px;border:1px solid #e3c765;background:linear-gradient(180deg,#b99a45,#806a2e);color:#fff4c4;font:bold 15px Consolas,"Courier New",monospace;letter-spacing:2px;cursor:pointer;box-shadow:0 0 24px rgba(221,185,76,.28)}
  #credits-return:hover{filter:brightness(1.2)}
  #credits-return[hidden]{display:none}
  .lobby-title{position:relative;z-index:1;margin:0;text-align:center;font-size:clamp(28px,6vw,56px);line-height:1.08;font-weight:900;letter-spacing:clamp(2px,.7vw,8px);color:#f0df9e;text-shadow:0 3px 24px #000}
  .lobby-card{position:relative;z-index:1;width:min(600px,100%);padding:24px 30px 22px;background:rgba(0,0,0,.5);border:1px solid rgba(192,177,119,.62);box-shadow:0 20px 70px #05090780,inset 0 1px rgba(255,255,255,.07)}
  .lobby-kicker{text-align:center;color:#b1a77d;font-size:10px;letter-spacing:3px;margin-bottom:14px}
  .lobby-rule{height:1px;background:linear-gradient(90deg,transparent,#a79c6f,transparent);margin:0 0 16px}
  .lobby-field{display:block;margin:14px 0}
  .lobby-field span{display:block;margin:0 0 7px;color:#d4c99d;font-size:10px;letter-spacing:2px}
  .lobby-field input,.lobby-field select{display:block;width:100%;height:42px;padding:0 13px;border:1px solid #77745f;border-radius:0;background:rgba(12,15,12,.84);color:#ecebe2;font:14px Consolas,"Courier New",monospace;letter-spacing:1px;outline:none}
  .lobby-field input:focus,.lobby-field select:focus{border-color:#d0b75d;box-shadow:0 0 0 2px #b9a76b2c}
  .lobby-field select{color-scheme:dark;cursor:pointer;transition:border-color .2s,box-shadow .2s}
  .lobby-field select:hover{border-color:#c5a85c;box-shadow:0 0 12px rgba(201,157,63,.18)}
  .stage-select{margin:14px 0}
  .stage-select-label{display:block;margin-bottom:8px;color:#d4c99d;font-size:10px;letter-spacing:2px}
  .stage-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
  .stage-button,.tutorial-button,.credits-button{height:38px;border:1px solid rgba(181,170,126,.66);background:rgba(30,34,27,.76);color:#e6e1d0;font:bold 12px Consolas,"Courier New",monospace;letter-spacing:1px;cursor:pointer;transition:background .18s,border-color .18s,color .18s,transform .18s}
  .stage-button:hover,.tutorial-button:hover,.credits-button:hover{border-color:#d6bd69;background:rgba(106,91,46,.7);transform:translateY(-1px)}
  .stage-button[aria-pressed="true"]{border-color:#e0c765;background:rgba(132,111,48,.85);color:#fff3bd;box-shadow:inset 0 0 0 1px rgba(255,228,145,.24)}
  .lobby-action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .tutorial-button,.credits-button{width:100%;height:40px;margin:0;color:#f0df9e}
  .credits-button{border-color:#c5a85c;color:#f0df9e}
  #deploy{position:relative;width:100%;height:50px;margin-top:8px;border:1px solid #d5bd71;background:linear-gradient(180deg,#9b8a52,#74663c);color:#fff8df;font:bold 15px Consolas,"Courier New",monospace;letter-spacing:4px;text-shadow:0 1px #34301f;cursor:pointer;transition:filter .18s,transform .18s,box-shadow .18s,background .18s}
  #deploy:hover{filter:brightness(1.28);transform:translateY(-2px) scale(1.025);background:linear-gradient(180deg,#c59f47,#8f7333);box-shadow:0 0 10px rgba(255,199,76,.7),0 0 28px rgba(230,161,43,.38)}
  #deploy:active{filter:brightness(1.08);transform:translateY(1px) scale(.975);box-shadow:0 0 8px rgba(255,199,76,.42)}
  #deploy:disabled{cursor:wait;filter:grayscale(.45);transform:none;box-shadow:none}
  .lobby-footer{margin-top:13px;text-align:center;color:#a6a18b;font-size:9px;letter-spacing:1.5px}
  #result{position:fixed;inset:0;z-index:6;display:grid;place-items:center;padding:24px;background:rgba(5,8,7,.76)}
  #result[hidden]{display:none}
  .result-card{width:min(460px,100%);padding:38px 36px 32px;text-align:center;background:rgba(14,19,17,.92);border:1px solid rgba(202,198,174,.4);box-shadow:0 24px 80px #0509078c}
  .result-kicker{color:#b1a77d;font-size:10px;letter-spacing:3px}
  .result-card h2{margin:16px 0 9px;color:#e3e1d5;font-size:clamp(28px,7vw,40px);letter-spacing:3px}
  .result-card p{margin:0;color:#b7b6a8;font-size:12px;letter-spacing:1px;line-height:1.7}
  .result-card button{width:100%;height:48px;margin-top:27px;border:1px solid #d5bd71;background:linear-gradient(180deg,#9b8a52,#74663c);color:#fff8df;font:bold 14px Consolas,"Courier New",monospace;letter-spacing:3px;cursor:pointer}
  .result-card button:hover{filter:brightness(1.15)}
  #pause-menu{position:fixed;inset:0;z-index:7;display:grid;place-items:center;padding:24px;background:rgba(5,8,7,.76)}
  #pause-menu[hidden]{display:none}
  .pause-card{width:min(420px,100%);padding:34px 32px;text-align:center;background:rgba(14,19,17,.96);border:1px solid rgba(202,198,174,.48);box-shadow:0 24px 80px #0509078c}
  .pause-card h2{margin:0 0 25px;color:#e3d49a;font-size:clamp(28px,7vw,38px);letter-spacing:4px}
  .pause-card button{width:100%;height:48px;border:1px solid #d5bd71;background:linear-gradient(180deg,#9b8a52,#74663c);color:#fff8df;font:bold 14px Consolas,"Courier New",monospace;letter-spacing:3px;cursor:pointer}
  .pause-card button:hover{filter:brightness(1.15)}
  .pause-card button+button{margin-top:12px;border-color:#87836e;background:rgba(35,40,33,.95)}
  #pause-toggle{position:fixed;top:14px;right:14px;z-index:4;width:42px;height:38px;border:1px solid rgba(202,198,174,.7);background:rgba(14,19,17,.82);color:#e3d49a;font:bold 17px Consolas,"Courier New",monospace;cursor:pointer}
  #pause-toggle:hover{border-color:#e0c765;background:rgba(70,62,38,.95)}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
  @media(max-height:700px){#lobby{gap:12px;padding-top:14px;padding-bottom:14px}.lobby-card{padding:16px 24px}.lobby-kicker{margin-bottom:9px}.lobby-rule{margin-bottom:10px}.lobby-field{margin:9px 0}.lobby-action-row{margin-bottom:9px}}
  @media(max-width:520px){#lobby{gap:14px;padding:18px 12px}.lobby-title{font-size:clamp(25px,7vw,38px)}.lobby-card{padding:20px 18px}.stage-grid{gap:6px}.stage-button{height:36px;font-size:11px}.lobby-footer{font-size:8px}#hint{white-space:normal;width:95%;line-height:1.6}}
</style>
</head>
<body class="intro-active">
<video id="intro-video" src="./flag.mp4" autoplay muted playsinline preload="auto" aria-label="Video pembuka"></video>
<main id="lobby" aria-label="Lobby Battle of Gumuk Baung" hidden>
  <h1 class="lobby-title">BATTLE OF GUMUK BAUNG</h1>
  <form class="lobby-card" id="lobby-form">
    <div class="lobby-kicker">FIELD COMMAND · PILIH MISI</div>
    <div class="lobby-rule"></div>
    <div class="lobby-action-row">
      <button class="tutorial-button" id="tutorial" type="button">TUTORIAL</button>
      <button class="credits-button" id="open-credits" type="button">CREDITS</button>
    </div>
    <div class="stage-select">
      <span class="stage-select-label">PILIH STAGE</span>
      <div class="stage-grid" role="group" aria-label="Pilih stage">
        <button class="stage-button" type="button" data-stage="1" aria-pressed="true">STAGE 1</button>
        <button class="stage-button" type="button" data-stage="2" aria-pressed="false">STAGE 2</button>
        <button class="stage-button" type="button" data-stage="3" aria-pressed="false">STAGE 3</button>
        <button class="stage-button" type="button" data-stage="4" aria-pressed="false">STAGE 4</button>
        <button class="stage-button" type="button" data-stage="5" aria-pressed="false">STAGE 5</button>
        <button class="stage-button" type="button" data-stage="6" aria-pressed="false">STAGE 6</button>
        <button class="stage-button" type="button" data-stage="7" aria-pressed="false">STAGE 7</button>
        <button class="stage-button" type="button" data-stage="8" aria-pressed="false">STAGE 8</button>
      </div>
    </div>
    <label class="lobby-field">
      <span>CALLSIGN</span>
      <input id="callsign" name="callsign" type="text" maxlength="15" value="COMMANDER" autocomplete="off" required>
    </label>
    <label class="lobby-field">
      <span>DIFFICULTY</span>
      <select id="difficulty" name="difficulty">
        <option value="RECRUIT">RECRUIT</option>
        <option value="VETERAN" selected>VETERAN</option>
        <option value="ELITE">ELITE</option>
      </select>
    </label>
    <button id="deploy" type="submit">DEPLOY</button>
    <div class="lobby-footer">KLIK KIRI UNTUK BERGERAK · AUTO-SHOOT AKTIF</div>
  </form>
</main>
<section id="credits-screen" aria-label="Credits" hidden>
  <img id="credits-image" alt="Dokumentasi perjuangan Indonesia">
  <button id="credits-return" type="button" hidden>KEMBALI KE MENU</button>
</section>
<section id="result" aria-live="assertive" hidden>
  <div class="result-card">
    <div class="result-kicker">AFTER ACTION REPORT</div>
    <h2 id="result-title"></h2>
    <p id="result-copy"></p>
    <button id="return-to-lobby" type="button">KEMBALI KE LOBBY</button>
  </div>
</section>
<section id="pause-menu" aria-label="Menu jeda" aria-modal="true" role="dialog" hidden>
  <div class="pause-card">
    <h2>PAUSED</h2>
    <button id="resume-game" type="button">LANJUT</button>
    <button id="pause-return-lobby" type="button">KEMBALI KE LOBBY</button>
  </div>
</section>
<canvas id="game" aria-label="Game tank Iron Front"></canvas>
<div id="hint">KLIK KIRI GERAK · AUTO-AIM 400 · ESC PAUSE · M BISU · F FPS</div>
<button id="pause-toggle" type="button" aria-label="Buka menu jeda" title="Menu jeda" hidden>||</button>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d", { alpha: false });
  const TAU = Math.PI * 2;
  const MAP_SIZE = { w: 2752, h: 1536 };
  const WORLD = { w: MAP_SIZE.w, h: MAP_SIZE.h };
  // Koordinat obstacle memakai pixel asli desert.jpg.
  const mapBox=(x,y,width,height)=>({
    x:x*WORLD.w/MAP_SIZE.w,y:y*WORLD.h/MAP_SIZE.h,
    width:width*WORLD.w/MAP_SIZE.w,height:height*WORLD.h/MAP_SIZE.h
  });
  // Tambahkan mapBox(x,y,width,height) sesuai kategori; H menampilkan kotak debug merah.
  const mapObstacleGroups = {
    buildings: [
      mapBox(180,105,160,145),mapBox(360,105,240,130),
      mapBox(165,300,190,130),mapBox(405,300,190,125),
      mapBox(1420,446,245,219),mapBox(1760,469,250,206),
      mapBox(2630,475,122,175),mapBox(130,1000,220,230),
      mapBox(1515,980,330,245),mapBox(2630,1070,122,190),
      mapBox(1220,0,250,95)
    ],
    walls: [
      mapBox(180,95,170,18),mapBox(165,95,18,170),mapBox(165,265,185,18),
      mapBox(350,112,18,145),mapBox(350,275,250,16),mapBox(600,120,16,130),
      mapBox(1335,292,165,14),mapBox(1490,292,14,100),
      mapBox(680,615,220,16),mapBox(890,615,14,90),
      mapBox(2110,825,165,16),mapBox(2260,825,16,100),
      mapBox(105,975,210,16),mapBox(105,975,16,185),mapBox(105,1160,190,16),
      mapBox(2470,1070,145,16),mapBox(2470,1070,16,135)
    ],
    vehicles: [
      mapBox(2250,65,125,75),mapBox(2430,115,150,115),mapBox(2100,260,120,85),
      mapBox(2190,420,105,70),mapBox(1280,675,110,75),mapBox(250,660,115,75),
      mapBox(690,690,110,75),mapBox(980,920,205,145),mapBox(1280,825,125,180),
      mapBox(1810,895,150,95),mapBox(1240,1210,125,85),mapBox(1710,1270,115,75),
      mapBox(2240,1240,135,90)
    ]
  };
  const mapObstacles=[
    ...mapObstacleGroups.buildings,
    ...mapObstacleGroups.walls,
    ...mapObstacleGroups.vehicles
  ];
  const rand = (a,b) => a + Math.random() * (b-a);
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const angleDiff = (a,b) => Math.atan2(Math.sin(b-a),Math.cos(b-a));
  const distance = (a,b) => Math.hypot(a.x-b.x,a.y-b.y);
  let width=innerWidth,height=innerHeight,dpr=1, last=0, elapsed=0, fps=60, fpsFrames=0,fpsTime=0;
  let started=false, paused=false, gameOver=false, muted=false, showFps=false;
  let showCollisionDebug=true;
  const TANK_SCALE={player:.82,enemy:.76};
  let playerName="COMMANDER",gameDifficulty="VETERAN",selectedStage=1,lobbyActive=false,introComplete=false,creditsActive=false,creditsRunId=0;
  const DIFFICULTY={
    RECRUIT:{enemyCount:.65,hp:.72,speed:.88,aggression:.72,fireDelay:1.4},
    VETERAN:{enemyCount:1,hp:1,speed:1,aggression:1,fireDelay:1},
    ELITE:{enemyCount:1.28,hp:1.35,speed:1.12,aggression:1.28,fireDelay:.72}
  };
  const difficultySettings=()=>DIFFICULTY[gameDifficulty]||DIFFICULTY.VETERAN;
  let player, enemies=[], shells=[], particles=[], tracks=[], decals=[], wave=0, stageTargetWave=1, score=0, waveSpawnTimer=0, waveSpawnsRemaining=0, waveIntermission=1, waveRunning=false, camera={x:0,y:0};
  let victory=false,resultReturnTimer=0;
  let shake=0, heat=0, terrainPattern, audio=null, lobbyMusicPlayPromise=null, lobbyMusicFadeTimer=0, lobbyMusicPlayToken=0;
  let moveTarget=null,targetMarker=null;
  const AUTO_AIM_RANGE=400,AUTO_FIRE_INTERVAL=1.5;
  const lobbyMusic=new Audio("./musik_lobby.mp3");
  lobbyMusic.loop=true;lobbyMusic.preload="auto";lobbyMusic.volume=.5;
  const creditsImageFiles=[
    "gbr1 (1).jpg","gbr1 (2).jpg","gbr1 (3).jpg","gbr1 (4).jpg",
    "gbr5 (5).jpg","gbr6 (6).jpg","gbr7 (7).jpg","gbr8 (8).jpg"
  ];
  const creditsMusic=new Audio("./perang.mp3");
  creditsMusic.loop=true;creditsMusic.preload="auto";creditsMusic.volume=.18;
  const creditsVoice=new Audio("./merdeka.mp3");
  creditsVoice.preload="auto";
  const terrainImage=new Image();
  terrainImage.src="./desert.jpg";
  terrainImage.addEventListener("error",()=>console.error("Map gagal dimuat: desert.jpg"));
  const COLORS={ink:"#151914",olive:"#59624b",olive2:"#73775a",edge:"#30372d",dust:"#a18a69",rust:"#704b35"};

  function resize(){
    dpr=Math.min(devicePixelRatio||1,2); width=innerWidth;height=innerHeight;
    canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    makeTerrain();
  }
  function makeTerrain(){
    const tile=document.createElement("canvas");tile.width=256;tile.height=256;
    const t=tile.getContext("2d");
    const g=t.createLinearGradient(0,0,256,256);g.addColorStop(0,"#514b3d");g.addColorStop(.5,"#5a5343");g.addColorStop(1,"#48483d");
    t.fillStyle=g;t.fillRect(0,0,256,256);
    for(let i=0;i<2200;i++){
      const v=Math.floor(rand(35,145)), alpha=rand(.035,.18);
      t.fillStyle=`rgba(${v},${Math.floor(v*.92)},${Math.floor(v*.78)},${alpha})`;
      const r=rand(.3,2.1);t.fillRect(rand(0,256),rand(0,256),r,r);
    }
    for(let i=0;i<15;i++){
      t.strokeStyle=`rgba(32,34,27,${rand(.05,.16)})`;t.lineWidth=rand(1,3);
      t.beginPath();t.ellipse(rand(0,256),rand(0,256),rand(12,65),rand(4,17),rand(0,TAU),0,TAU);t.stroke();
    }
    terrainPattern=ctx.createPattern(tile,"repeat");
  }
  addEventListener("resize",resize);resize();

  function resumeAudioContext(){
    if(!audio||audio.state!=="suspended")return;
    const attempt=audio.resume();
    if(attempt&&typeof attempt.catch==="function"){
      attempt.catch(error=>{
        if(error.name!=="NotAllowedError")console.error("AudioContext gagal dilanjutkan:",error);
      });
    }
  }
  function initAudio(){
    if(audio){resumeAudioContext();return}
    const AC=window.AudioContext||window.webkitAudioContext;
    if(AC)audio=new AC();
    resumeAudioContext();
  }
  function startLobbyMusic(){
    if(muted||!lobbyActive)return;
    initAudio();
    if(!lobbyMusic.paused||lobbyMusicPlayPromise)return;
    clearInterval(lobbyMusicFadeTimer);lobbyMusicFadeTimer=0;lobbyMusic.volume=.5;
    const token=++lobbyMusicPlayToken;
    const attempt=lobbyMusic.play();
    if(attempt&&typeof attempt.then==="function"){
      lobbyMusicPlayPromise=attempt;
      attempt.then(()=>{
        lobbyMusicPlayPromise=null;
        if(token!==lobbyMusicPlayToken||muted){
          lobbyMusic.pause();lobbyMusic.currentTime=0;lobbyMusic.volume=.5;
        }
      },error=>{
        lobbyMusicPlayPromise=null;
        if(error.name!=="NotAllowedError"&&error.name!=="AbortError")console.error("Musik lobby gagal diputar: musik_lobby.mp3",error);
      });
    }
  }
  function loadCreditsImage(src){
    const image=document.getElementById("credits-image");
    return new Promise((resolve,reject)=>{
      const cleanup=()=>{
        image.removeEventListener("load",onLoad);
        image.removeEventListener("error",onError);
      };
      const onLoad=()=>{cleanup();resolve()};
      const onError=()=>{cleanup();reject(new Error(`Gambar credits gagal dimuat: ${src}`))};
      image.addEventListener("load",onLoad);
      image.addEventListener("error",onError);
      image.src=`./${src}`;
      if(image.complete){
        if(image.naturalWidth)onLoad();
        else onError();
      }
    });
  }
  function playAudioUntilEnded(audioElement,label){
    return new Promise((resolve,reject)=>{
      const cleanup=()=>{
        audioElement.removeEventListener("ended",onEnded);
        audioElement.removeEventListener("error",onError);
      };
      const onEnded=()=>{cleanup();resolve()};
      const onError=()=>{cleanup();reject(new Error(`${label} gagal diputar: ${audioElement.currentSrc||audioElement.src}`))};
      audioElement.addEventListener("ended",onEnded);
      audioElement.addEventListener("error",onError);
      let playback;
      try{
        playback=audioElement.play();
      }catch(error){
        cleanup();reject(error);return;
      }
      if(playback&&typeof playback.catch==="function"){
        playback.catch(error=>{cleanup();reject(error)});
      }
    });
  }
  const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  async function startCredits(){
    if(!lobbyActive||creditsActive)return;
    creditsActive=true;lobbyActive=false;
    const runId=++creditsRunId;
    pauseLobbyMusic();
    const lobby=document.getElementById("lobby");
    lobby.hidden=true;lobby.setAttribute("aria-hidden","true");
    document.body.classList.remove("lobby-active");
    document.body.classList.add("credits-active");
    const creditsScreen=document.getElementById("credits-screen");
    const creditsImage=document.getElementById("credits-image");
    const returnButton=document.getElementById("credits-return");
    returnButton.hidden=true;
    creditsImage.classList.remove("is-visible");
    creditsScreen.hidden=false;
    creditsVoice.pause();creditsVoice.currentTime=0;
    creditsMusic.currentTime=0;
    try{
      let musicStart;
      try{
        musicStart=creditsMusic.play();
      }catch(error){
        console.error("Musik credits gagal diputar: perang.mp3",error);
      }
      const voicePlayback=playAudioUntilEnded(creditsVoice,"Voice-over").then(
        ()=>({ended:true}),
        error=>({ended:true,error})
      );
      if(musicStart&&typeof musicStart.then==="function"){
        try{
          await musicStart;
        }catch(error){

  function segmentIntersectsAabb(x1,y1,x2,y2,box,padding=0){

    for(const [origin,direction,min,max] of [[x1,dx,minX,maxX],[y1,dy,minY,maxY]]){

        continue;
      }

      if(a>b)[a,b]=[b,a];
      near=Math.max(near,a);far=Math.min(far,b);

    return true;
  }
  function resolveTankMapCollision(t){
    for(let pass=0;pass<2;pass++){
      for(const box of mapObstacles){
        const nearestX=clamp(t.x,box.x,box.x+box.width);
        const nearestY=clamp(t.y,box.y,box.y+box.height);

            {distance:box.x+box.width+t.radius-t.x,x:1,y:0},
            {distance:t.y-(box.y-t.radius),x:0,y:-1},
            {distance:box.y+box.height+t.radius-t.y,x:0,y:1}
          ];
          exits.sort((a,b)=>a.distance-b.distance);
          const exit=exits[0];
          t.x+=exit.x*exit.distance;t.y+=exit.y*exit.distance;
          dx=exit.x;dy=exit.y;d=1;

  function predictTargetPoint(shooter,target,projectileSpeed){
    const dx=target.x-shooter.x,dy=target.y-shooter.y;

  function updateTank(t,dt){

    ctx.font="10px Consolas";ctx.fillStyle="#b8b19b";ctx.fillText("SHELLS",34,126);
    ctx.font="bold 18px Consolas";ctx.fillStyle=player.ammo>2?"#e1d7b6":"#d17a57";ctx.fillText(`${String(player.ammo).padStart(2,"0")}  /  ${player.maxAmmo}`,100,129);
    ctx.fillStyle="#a8a38e";ctx.font="9px Consolas";ctx.fillText(`DIFFICULTY  ${gameDifficulty}`,34,151);
    if(showCollisionDebug){ctx.fillStyle="#ff7770";ctx.font="bold 10px Consolas";ctx.fillText(`H  COLLISION DEBUG ON  ·  ${mapObstacles.length} BOXES`,34,171)}
    ctx.fillStyle="#d3ccb2";ctx.font="bold 13px Consolas";ctx.textAlign="right";
    ctx.fillText(`SCORE  ${String(score).padStart(6,"0")}`,width-24,31);
    ctx.fillStyle="#b8b29c";ctx.font="11px Consolas";ctx.fillText(`SECTOR  ${String(wave).padStart(2,"0")}   ·   HOSTILES ${String(enemies.length).padStart(2,"0")}`,width-24,49);
    if(player.ammo===0&&player.magazineReload>0){ctx.fillStyle="rgba(18,20,17,.75)";ctx.fillRect(width/2-72,height-42,144,22);ctx.fillStyle="#c9bb8f";ctx.fillRect(width/2-68,height-38,136*(1-player.magazineReload/player.magazineReloadTime),14);ctx.fillStyle="#ece3c8";ctx.font="10px Consolas";ctx.textAlign="center";ctx.fillText("RELOADING",width/2,height-26)}
    drawMinimap();
    if(showFps){ctx.textAlign="left";ctx.font="11px Consolas";ctx.fillStyle="#e0d9c2";ctx.fillText(`${fps.toFixed(0)} FPS`,20,height-20)}
    if(muted){ctx.textAlign="left";ctx.fillStyle="#d0c8ab";ctx.font="10px Consolas";ctx.fillText("AUDIO OFF",20,219)}
    ctx.restore()
  }
  function vignette(){
    const g=ctx.createRadialGradient(width/2,height/2,Math.min(width,height)*.25,width/2,height/2,Math.max(width,height)*.72);
    g.addColorStop(0,"rgba(0,0,0,0)");g.addColorStop(1,"rgba(9,11,9,.62)");ctx.fillStyle=g;ctx.fillRect(0,0,width,height);
    const light=ctx.createRadialGradient(width*.35,height*.28,20,width*.35,height*.28,Math.max(width,height)*.75);
    light.addColorStop(0,"rgba(221,205,158,.035)");light.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=light;ctx.fillRect(0,0,width,height);
  }
  function panel(title,subtitle,lines,button){
    ctx.fillStyle="rgba(8,10,9,.78)";ctx.fillRect(0,0,width,height);
    const w=Math.min(540,width-36),h=320,x=(width-w)/2,y=(height-h)/2;
    ctx.fillStyle="rgba(29,33,28,.95)";ctx.fillRect(x,y,w,h);
    ctx.strokeStyle="#77765f";ctx.lineWidth=1;ctx.strokeRect(x,y,w,h);
    ctx.fillStyle="#d1c9ad";ctx.textAlign="center";
    ctx.font="bold 36px Consolas";ctx.fillText(title,width/2,y+67);
    ctx.fillStyle="#928d77";ctx.font="12px Consolas";ctx.fillText(subtitle,width/2,y+94);
    ctx.fillStyle="#c6c0a9";ctx.font="12px Consolas";
    lines.forEach((line,i)=>ctx.fillText(line,width/2,y+139+i*22));
    ctx.fillStyle="#777f61";ctx.fillRect(width/2-100,y+h-61,200,34);
    ctx.strokeStyle="#a4a486";ctx.strokeRect(width/2-100,y+h-61,200,34);
    ctx.fillStyle="#f1ebd2";ctx.font="bold 13px Consolas";ctx.fillText(button,width/2,y+h-39);
    ctx.fillStyle="#85816f";ctx.font="10px Consolas";ctx.fillText("IRON FRONT  ·  FIELD MANUAL 01",width/2,y+h+23)
  }
  function render(){
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle="#171a16";ctx.fillRect(0,0,width,height);
    if(started||paused||gameOver){
      const sx=rand(-shake,shake),sy=rand(-shake,shake);
      ctx.save();ctx.translate(width/2-camera.x+sx,height/2-camera.y+sy);
      drawTerrain();drawTargetMarker();for(const s of shells)drawShell(s);
      for(const e of enemies)drawTank(e);drawTank(player);drawHeat();drawParticles();
      ctx.restore();vignette();
      if(started&&!paused&&!gameOver)drawHud();
    }
    requestAnimationFrame(frame);
  }
  function frame(ts){
    const dt=Math.min(.04,(ts-last)/1000||0);last=ts;update(dt);render();
  }
  requestAnimationFrame(frame);

  function isGameplayPoint(x,y){
    if(x>=15&&x<=273&&y>=15&&y<=209)return false;
    if(x>=width-230&&y<=60)return false;
    if(x>=width-159&&y>=height-159)return false;
    if(y>=height-30)return false;
    if(muted&&x<=110&&y>=200&&y<=235)return false;
    if(showFps&&x<=100&&y>=height-40)return false;
    return !(player.ammo===0&&x>=width/2-76&&x<=width/2+76&&y>=height-46&&y<=height-16);
  }
  function startGame(stage=selectedStage){
    const stageNumber=Number(stage);
    if(Number.isInteger(stageNumber)&&stageNumber>=1&&stageNumber<=8)selectedStage=stageNumber;
    if(gameOver)reset();
    wave=selectedStage-1;
    stageTargetWave=selectedStage;
    document.getElementById("pause-toggle").hidden=false;
    started=true;paused=false;initAudio();canvas.focus();
  }
  function setGamePaused(value){
    paused=value;
    document.getElementById("pause-menu").hidden=!paused;
  }
  function returnToLobby(){
    clearTimeout(resultReturnTimer);resultReturnTimer=0;
    document.getElementById("result").hidden=true;
    document.getElementById("pause-menu").hidden=true;
    document.getElementById("pause-toggle").hidden=true;
    started=false;paused=false;
    document.getElementById("callsign").value=playerName;
    document.getElementById("difficulty").value=gameDifficulty;
    document.getElementById("deploy").disabled=false;
    reset();
    lobbyActive=true;
    const lobby=document.getElementById("lobby");
    lobby.hidden=false;
    lobby.removeAttribute("aria-hidden");
    lobby.classList.remove("is-departing");
    lobby.classList.add("is-visible");
    document.body.classList.add("lobby-active");
    startLobbyMusic();
  }
  const introVideo=document.getElementById("intro-video");
  introVideo.muted=true;
  introVideo.loop=false;
  let introTransitionStarted=false;
  let introPlaybackFailed=false;
  function finishIntro(){
    if(introTransitionStarted)return;
    introTransitionStarted=true;
    introVideo.pause();
    introVideo.classList.add("is-fading");
    const showLobby=()=>{
      if(introComplete)return;
      introComplete=true;
      introVideo.hidden=true;
      document.body.classList.remove("intro-active");
      document.body.classList.add("lobby-active");
      const lobby=document.getElementById("lobby");
      lobby.hidden=false;
      lobby.removeAttribute("aria-hidden");
      requestAnimationFrame(()=>lobby.classList.add("is-visible"));
      lobbyActive=true;
      startLobbyMusic();
    };
    introVideo.addEventListener("transitionend",event=>{
      if(event.target===introVideo&&event.propertyName==="opacity")showLobby();
    },{once:true});
    setTimeout(showLobby,950);
  }
  function handleIntroPlaybackFailure(error){
    if(introPlaybackFailed)return;
    introPlaybackFailed=true;
    console.error("Video pembuka gagal diputar: flag.mp4",error);
    finishIntro();
  }
  introVideo.addEventListener("ended",finishIntro);
  introVideo.addEventListener("error",()=>handleIntroPlaybackFailure(introVideo.error),{once:true});
  const introPlayback=introVideo.play();
  if(introPlayback&&typeof introPlayback.catch==="function"){
    introPlayback.catch(handleIntroPlaybackFailure);
  }
  document.getElementById("lobby").addEventListener("pointerdown",startLobbyMusic);
  document.getElementById("lobby").addEventListener("focusin",startLobbyMusic);
  document.getElementById("callsign").addEventListener("input",startLobbyMusic);
  document.getElementById("open-credits").addEventListener("click",startCredits);
  document.getElementById("credits-return").addEventListener("click",returnFromCredits);
  document.getElementById("tutorial").addEventListener("click",()=>{
    document.getElementById("lobby-form").requestSubmit(document.getElementById("deploy"));
  });
  document.querySelectorAll(".stage-button").forEach(button=>{
    button.addEventListener("click",()=>{
      selectedStage=Number(button.dataset.stage);
      document.querySelectorAll(".stage-button").forEach(stageButton=>{
        stageButton.setAttribute("aria-pressed",String(stageButton===button));
      });
      soundLobbyClick();
    });
  });
  document.getElementById("lobby-form").addEventListener("submit",e=>{
    e.preventDefault();
    const deployButton=document.getElementById("deploy");
    if(deployButton.disabled)return;
    deployButton.disabled=true;
    playerName=document.getElementById("callsign").value.trim().slice(0,15)||"COMMANDER";
    const selectedDifficulty=document.getElementById("difficulty").value;
    gameDifficulty=DIFFICULTY[selectedDifficulty]?selectedDifficulty:"VETERAN";
    initAudio();
    soundLobbyClick();
    fadeOutLobbyMusic();
    lobbyActive=false;
    const lobby=document.getElementById("lobby");
    lobby.classList.add("is-departing");
    document.body.classList.remove("lobby-active");
    startGame(selectedStage);
    setTimeout(()=>{
      lobby.hidden=true;
      lobby.setAttribute("aria-hidden","true");
    },800);
  });
  document.getElementById("return-to-lobby").addEventListener("click",returnToLobby);
  document.getElementById("resume-game").addEventListener("click",()=>{
    setGamePaused(false);
    canvas.focus();
  });
  document.getElementById("pause-return-lobby").addEventListener("click",returnToLobby);
  document.getElementById("pause-toggle").addEventListener("click",()=>setGamePaused(true));
  addEventListener("keydown",e=>{
    if(lobbyActive)startLobbyMusic();
    const k=e.key.toLowerCase();
    if(["arrowup","arrowdown","arrowleft","arrowright"].includes(k))e.preventDefault();
    if(k==="escape"&&started){setGamePaused(!paused)}
    if(k==="m"){
      muted=!muted;
      if(!muted&&(started||lobbyActive))initAudio();
      syncLobbyMusicMute();
    }
    if(k==="f")showFps=!showFps;
    if(k==="h")showCollisionDebug=!showCollisionDebug;
  });
  canvas.addEventListener("pointerdown",e=>{
    if(e.button!==0)return;
    e.preventDefault();
    if(paused)return;
    if(gameOver){startGame(selectedStage);return}
    if(!started)return;
    const rect=canvas.getBoundingClientRect(),x=e.clientX-rect.left,y=e.clientY-rect.top;
    if(!isGameplayPoint(x,y))return;
    initAudio();
    moveTarget=worldPoint(x,y);
    targetMarker={...moveTarget,life:.5};
  });
  document.addEventListener("visibilitychange",()=>{if(document.hidden&&started)setGamePaused(true)});
})();
</script>
</body>
</html>
